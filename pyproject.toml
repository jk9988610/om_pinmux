[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "om6239-pinmux"
version = "0.2.0"
description = "OM6239 lightweight config-driven pinmux generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pywebview>=5.0", "pyyaml>=6.0"]

[project.scripts]
om-pinmux = "omcfg.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["omcfg*"]
