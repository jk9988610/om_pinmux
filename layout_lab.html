<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>OM6239 UI Layout Lab</title>
<style>
:root{--bg:#15181e;--p:#212733;--l:#3c4657;--t:#e8edf4;--m:#9aa6b7;--a:#4aa8ff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--t);font:12px Segoe UI,Microsoft YaHei,sans-serif}button,input{font:inherit}button{color:var(--t);background:#303946;border:1px solid var(--l);border-radius:4px;padding:4px 8px;cursor:pointer}.app{height:100%;display:grid;grid-template-rows:34px 1fr 165px}.bar{display:flex;align-items:center;gap:9px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--l)}h1{font-size:13px;margin:0}.grow{margin-left:auto}.main{display:grid;grid-template-columns:290px 1fr;min-height:0}.ctl{overflow:auto;padding:10px;background:var(--p);border-right:1px solid var(--l)}h2{font-size:12px;margin:10px 0 5px}.row{display:grid;grid-template-columns:1fr 60px;gap:6px;align-items:center;margin:5px 0;color:var(--m)}.row input{width:100%;background:#12161c;color:var(--t);border:1px solid var(--l);padding:3px;border-radius:3px}.row input[type=range]{grid-column:1/3;accent-color:var(--a)}.hint{font-size:10px;color:var(--m);line-height:1.5}.preview{position:relative;overflow:hidden;background:radial-gradient(circle,#263343 0,#15181e 68%)}.window{position:absolute;left:50%;top:50%;translate:-50% -50%;resize:both;overflow:hidden;min-width:600px;min-height:380px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);display:grid;grid-template-columns:var(--left) 1fr var(--right);grid-template-rows:1fr var(--out);box-shadow:0 16px 45px #0008;background:#1a202a}.side{background:#222936;color:var(--m);padding:8px;font-size:11px}.left{grid-row:1/3}.right{grid-column:3;grid-row:1/3}.chipPane{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.chip{position:relative;width:min(var(--cw),calc(100% - var(--margin)*2));height:min(var(--ch),calc(100% - var(--margin)*2));min-width:180px;min-height:110px}.body{position:absolute;left:11%;right:11%;top:27%;bottom:27%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#3a4655,#242b35);border:2px solid #6d7b91;border-radius:12px}.body b{font-size:18px;letter-spacing:.1em}.body span{margin-top:5px;color:#caffd2;background:#347b4659;border-radius:9px;padding:2px 7px;font-size:10px}.pin{position:absolute;width:var(--pw);height:var(--ph);border:1px solid #6a7890;border-radius:3px;background:#3b4757;font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:grab;user-select:none;touch-action:none}.pin small{font-size:7px;color:#c6cfdb}.pin.sel{outline:2px solid var(--a);z-index:4}.legend{position:absolute;bottom:4px;left:5%;right:5%;text-align:center;color:var(--m);font-size:9px}.out{grid-column:2;grid-row:2;overflow:auto;padding:7px;background:#11151b;border-top:1px solid var(--l);color:#aab7c8;font:10px Consolas}.data{display:grid;grid-template-columns:1fr 220px;border-top:1px solid var(--l);background:#10141a}.data pre{margin:0;padding:9px 12px;overflow:auto;color:#b9c6d5;font:11px/1.45 Consolas;white-space:pre-wrap}.data aside{padding:8px;border-left:1px solid var(--l)}.data button{width:100%;margin-bottom:6px}.mut{color:var(--m)}
</style>
<div class="app"><header class="bar"><h1>OM6239 UI Layout Lab</h1><span class="mut">拖动预览窗口 / 引脚，实时回收布局参数</span><span class="grow"></span><button id="reset">重置</button></header><main class="main"><aside class="ctl"><h2>侧栏与输出区</h2><div id="c1"></div><h2>芯片与标签</h2><div id="c2"></div><label class="mut"><input id="snap" type="checkbox" checked> 吸附到边缘 / 中心线</label><p class="hint">芯片和引脚会按照设计尺寸映射到当前模块并等比例缩放。拖动芯片预览窗口可检查不同模块窗口尺寸；拖动单个引脚可测试微调。</p></aside><section class="preview" id="preview"><div class="window" id="win"><aside class="side left">功能角色<br><br>按键<br>滚轮<br>模式<br>Sensor</aside><section class="chipPane"><div class="chip" id="chip"><div class="body"><b>OM6239</b><span>校验通过</span></div></div><div class="legend">■ 按键　■ 滚轮　■ 模式　■ Sensor　■ LOGO　■ 电源</div></section><aside class="side right">板级选项<br><br>模式脚<br>LOGO<br>策略<br>GPIO 表</aside><pre class="out">输出 / 报告
校验 / 复用
业务引用 · 换板体检 · 金机清单</pre></div></section></main><section class="data"><pre id="data"></pre><aside><button id="copy">复制实时参数</button><button id="css">复制 CSS 变量</button><span class="mut" id="state">实时更新中</span></aside></section></div>
<script>
const D={left:100,right:100,out:70,cw:509,ch:340,pw:30,ph:17,margin:7,gap:1},S={...D},N=['P32','P00','P01','VDD','VBUS','P02','P03','P04','P05','P06','P07','P10','P11','P12','P13','P33','P34','XTALP','XTALN','BOOT','RF','P36','P20','P21','P22','P23','P24','P25','P26','P27','P30','P31'],chip=document.querySelector('#chip'),win=document.querySelector('#win'),preview=document.querySelector('#preview');
function add(id,rows){let q=document.querySelector(id);rows.forEach(([k,n,a,b])=>q.insertAdjacentHTML('beforeend',`<div class=row><label>${n}</label><input data-k=${k} type=number min=${a} max=${b}><input data-k=${k} type=range min=${a} max=${b}></div>`))}add('#c1',[['left','左侧栏宽度',100,500],['right','右侧栏宽度',100,500],['out','输出区高度',70,500]]);add('#c2',[['cw','芯片设计宽度',220,900],['ch','芯片设计高度',140,600],['pw','标签宽度',16,90],['ph','标签高度',12,60],['margin','外边距',0,100],['gap','标签间距',0,30]]);
function sync(){document.querySelectorAll('[data-k]').forEach(x=>x.value=S[x.dataset.k])}function vars(){let r=document.documentElement.style;for(let [a,b] of Object.entries({left:'left',right:'right',out:'out',cw:'cw',ch:'ch',pw:'pw',ph:'ph',margin:'margin'}))r.setProperty('--'+a,S[b]+'px')}function pos(i){let side=i<8?'l':i<16?'b':i<24?'r':'t',n=i%8,w=S.cw,h=S.ch,g=S.gap,x,y;if(side==='t'||side==='b'){x=92+n*((w-184-g*7)/7);y=side==='t'?S.margin:h-S.ph-S.margin}else{x=side==='l'?S.margin:w-S.pw-S.margin;y=50+(side==='l'?n:7-n)*((h-100-g*7)/7)}return{x,y}}
function drag(e){e.onpointerdown=a=>{a.preventDefault();e.setPointerCapture(a.pointerId);e.classList.add('sel');let R=chip.getBoundingClientRect(),sx=S.cw/R.width,sy=S.ch/R.height,ox=a.clientX,oy=a.clientY,x0=+e.dataset.x,y0=+e.dataset.y;let move=b=>{let x=x0+(b.clientX-ox)*sx,y=y0+(b.clientY-oy)*sy;if(document.querySelector('#snap').checked){for(let v of [S.margin,S.cw-S.pw-S.margin,S.cw/2-S.pw/2])if(Math.abs(x-v)<7)x=v;for(let v of [S.margin,S.ch-S.ph-S.margin,S.ch/2-S.ph/2])if(Math.abs(y-v)<7)y=v}x=Math.max(0,Math.min(S.cw-S.pw,x));y=Math.max(0,Math.min(S.ch-S.ph,y));e.style.left=x/sx+'px';e.style.top=y/sy+'px';e.dataset.x=x;e.dataset.y=y};let end=()=>{e.classList.remove('sel');e.onpointermove=e.onpointerup=e.onpointercancel=null};e.onpointermove=move;e.onpointerup=end;e.onpointercancel=end}}
function pins(){chip.querySelectorAll('.pin').forEach(x=>x.remove());let R=chip.getBoundingClientRect(),sx=R.width/S.cw,sy=R.height/S.ch;N.forEach((n,i)=>{let p=pos(i),e=document.createElement('div');e.className='pin';e.dataset.x=p.x;e.dataset.y=p.y;e.innerHTML=`<b>${n}</b><small>#${i+1}</small>`;e.style.left=p.x*sx+'px';e.style.top=p.y*sy+'px';chip.append(e);drag(e)})}function render(){vars();requestAnimationFrame(()=>{pins();let r=chip.getBoundingClientRect();document.querySelector('#data').textContent=JSON.stringify({sidebars:{left:S.left,right:S.right},output:{height:S.out},chip:{designWidth:S.cw,designHeight:S.ch,renderWidth:Math.round(r.width),renderHeight:Math.round(r.height),margin:S.margin},pin:{width:S.pw,height:S.ph,gap:S.gap},snap:document.querySelector('#snap').checked},null,2)})}document.querySelectorAll('[data-k]').forEach(x=>x.oninput=e=>{S[e.target.dataset.k]=+e.target.value;sync();render()});document.querySelector('#reset').onclick=()=>{Object.assign(S,D);sync();render()};
win.onpointerdown=e=>{if(e.target!==win)return;let r=win.getBoundingClientRect(),p=preview.getBoundingClientRect(),ox=e.clientX,oy=e.clientY,l=r.left-p.left,t=r.top-p.top;win.setPointerCapture(e.pointerId);win.onpointermove=a=>{let x=l+a.clientX-ox,y=t+a.clientY-oy;if(document.querySelector('#snap').checked){if(Math.abs(x)<8)x=0;if(Math.abs(y)<8)y=0}win.style.left=x+'px';win.style.top=y+'px';win.style.translate='0 0'};win.onpointerup=win.onpointercancel=()=>win.onpointermove=null};new ResizeObserver(render).observe(win);document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('#data').textContent);document.querySelector('#state').textContent='已复制实时参数'};document.querySelector('#css').onclick=async()=>{await navigator.clipboard.writeText(`:root { --left-pane:${S.left}px; --right-pane:${S.right}px; --output-pane:${S.out}px; }\n.chip-wrap { width:${S.cw}px; height:${S.ch}px; }\n.pin { width:${S.pw}px; height:${S.ph}px; }`);document.querySelector('#state').textContent='已复制 CSS 变量'};sync();render();
</script>
